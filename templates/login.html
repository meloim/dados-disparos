<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar • Relatórios Datafy</title><style>:root{font-family:Segoe UI,Arial,sans-serif;color:#193345;background:#eef3f5}body{margin:0;min-height:100vh;display:grid;place-items:center}.box{width:min(420px,90vw);background:white;border:1px solid #d8e4e9;border-radius:14px;padding:30px;box-shadow:0 12px 35px #12374818}h1{margin-top:0}label{display:block;margin:15px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #afc3cc;border-radius:7px}button{width:100%;margin-top:20px;background:#08758b;color:white;border:0;border-radius:7px;padding:12px;font-size:15px}.notice{background:#fff1d6;padding:12px;border-radius:7px}</style></head><body><main class="box"><h1>Relatórios do WhatsApp</h1><p>Acesso administrativo</p>{% for message in get_flashed_messages() %}<div class="notice">{{message}}</div>{% endfor %}<form method="post"><input type="hidden" name="csrf" value="{{session.csrf}}"><label>Usuário</label><input name="username" autocomplete="username" required><label>Senha</label><input type="password" name="password" autocomplete="current-password" required><button>Entrar</button></form></main></body></html>

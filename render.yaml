services:
  - type: web
    name: datafy-relatorios
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 30
    healthCheckPath: /healthz
    envVars:
      - key: RENDER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: PANEL_USERNAME
        value: admin
      - key: PANEL_PASSWORD
        sync: false
      - key: DATAFY_WEBHOOK_SECRET
        sync: false
      - key: DATAFY_PHONE_NUMBER_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: datafy-relatorios-db
          property: connectionString

databases:
  - name: datafy-relatorios-db
    plan: free
    databaseName: datafy_relatorios
    user: datafy_relatorios
